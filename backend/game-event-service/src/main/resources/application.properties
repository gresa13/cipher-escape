spring.application.name=game-event-service

# ------------------------------------------------------------
# Database Configuration (PostgreSQL)
# ------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5433/cipher_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------
# JPA / Hibernate Config
# ------------------------------------------------------------
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# IMPORTANT: We use 'validate' because Flyway manages the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ------------------------------------------------------------
# Flyway Migration Config
# ------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=postgres
spring.flyway.password=password

# ------------------------------------------------------------
# Kafka Configuration
# ------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=game-service-group
spring.kafka.consumer.auto-offset-reset=earliest